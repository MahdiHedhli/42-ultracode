[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "42-ultracode"
version = "0.1.0"
description = "Subscription-native orchestration for disciplined iterative ChatGPT + Codex engineering workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ultracode = "ultracode.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
include = ["ultracode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["ultracode"]
